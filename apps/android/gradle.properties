org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

# Sur certains postes, Gradle refuse de démarrer : « Unable to establish loopback connection », avant
# même la lecture du projet. La cause n'est pas le réseau. Depuis Java 17, le sélecteur NIO par lequel
# le lanceur et le démon communiquent repose sur une **socket de domaine Unix** créée dans le
# répertoire temporaire ; quand celui-ci est annoncé sous sa forme courte 8.3
# (« C:\Users\ANTUNE~1\AppData\Local\Temp »), `connect` échoue avec « Invalid argument ».
#
# La correction ne se fait pas ici : ni `org.gradle.jvmargs` ni `GRADLE_OPTS` n'atteignent le démon
# — vérifié dans son journal, qui montre qu'il démarre sans la propriété. Il faut déplacer le
# répertoire lui-même, par `TEMP`/`TMP`. Utilisez `build-apk.ps1`, qui s'en charge.
org.gradle.configuration-cache=true
org.gradle.parallel=true
android.nonTransitiveRClass=true
android.useAndroidX=true

# La surveillance du système de fichiers ne fonctionne pas sur un partage réseau : Gradle le signale
# lui-même (« Couldn't add watch, error = 1 »). La laisser active coûte des tentatives inutiles à
# chaque construction, sans jamais rendre le service attendu.
org.gradle.vfs.watch=false
