<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>FlixTunes — connexion au serveur</title>
<!--
  Le seul écran que la coque dessine elle-même, et il n'existe que parce qu'il faut bien une adresse
  avant de pouvoir charger le client Web. Tout le reste vient du serveur.

  Les jetons de style sont ceux du Web, recopiés à la main pour ces quelques éléments : on ne peut
  pas charger la feuille de style d'un serveur qu'on ne connaît pas encore.
-->
<style>
  :root { --encre: #080b12; --texte: #f7f9ff; --muet: #9ba5b9; --bleu: #2e6bff; --ligne: rgba(255,255,255,.1); }
  html, body { margin: 0; height: 100%; }
  body { display: grid; place-items: center; background: var(--encre); color: var(--texte);
    font-family: "Segoe UI", system-ui, sans-serif; -webkit-app-region: drag; }
  main { width: min(460px, 82vw); -webkit-app-region: no-drag; }
  /*
    L'enseigne, reprise du client Web : le logo, « Flix » en blanc, « Tunes » en bleu. La coupure du
    nom en deux couleurs est ce qui identifie l'application d'un coup d'œil, et cet écran est le seul
    que la coque dessine — il n'a aucune raison d'y renoncer.

    Les valeurs viennent de `.brand` dans `styles.css` : logo de 41 px, police Manrope à 800, approche
    resserrée, et le bleu #79a8ff. Ici l'enseigne est agrandie, puisqu'elle est seule sur l'écran.
  */
  .enseigne { display: flex; align-items: center; margin-bottom: .55rem;
    font: 800 2.3rem "Manrope", "Segoe UI", system-ui, sans-serif; letter-spacing: -.06em; color: #fff; }
  .enseigne img { width: 62px; height: 62px; object-fit: contain; margin-right: .5rem;
    filter: drop-shadow(0 10px 26px #1689ff55); }
  .enseigne span span { color: #79a8ff; }
  p { margin: 0 0 1.6rem; color: var(--muet); line-height: 1.55; }
  label { display: block; margin-bottom: .4rem; color: var(--muet); font-size: .8rem; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; min-height: 46px; padding: .7rem .8rem;
    border: 1px solid var(--ligne); border-radius: 10px; background: #090d15; color: var(--texte); font: inherit; }
  input:focus-visible { outline: 3px solid #78a5ff; outline-offset: 2px; }
  .commandes { display: flex; gap: .6rem; margin-top: 1.1rem; }
  button { min-height: 46px; padding: 0 1.3rem; border: 0; border-radius: 12px; background: var(--bleu);
    color: var(--texte); font: inherit; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .erreur { margin-top: .9rem; color: #ff9ba8; font-size: .88rem; min-height: 1.2em; }
</style>
</head>
<body>
<main>
  <div class="enseigne">
    <img src="marque/flixtunes-logo.png" alt="">
    <span>Flix<span>Tunes</span></span>
  </div>
  <p>Indiquez l'adresse de votre serveur sur le réseau local — son adresse IP, ou son nom.
     Le port 4000 est ajouté si vous ne le précisez pas.</p>
  <label for="adresse">Adresse du serveur</label>
  <input id="adresse" type="text" inputmode="url" autocomplete="off" spellcheck="false"
         placeholder="192.168.1.50" autofocus>
  <div class="commandes"><button id="connecter">Se connecter</button></div>
  <div class="erreur" id="erreur" role="alert"></div>
</main>
<script>
  const champ = document.getElementById("adresse");
  const bouton = document.getElementById("connecter");
  const erreur = document.getElementById("erreur");

  async function connecter() {
    const saisie = champ.value.trim();
    if (!saisie) { erreur.textContent = "Indiquez une adresse."; return; }
    bouton.disabled = true;
    erreur.textContent = "";
    // La coque valide, retient, puis recharge d'elle-même sur le client Web.
    const reponse = await window.flixtunesBureau.definirServeur(saisie);
    if (!reponse.ok) {
      erreur.textContent = reponse.message ?? "Adresse invalide.";
      bouton.disabled = false;
    }
  }

  bouton.addEventListener("click", connecter);
  champ.addEventListener("keydown", (evenement) => { if (evenement.key === "Enter") connecter(); });
</script>
</body>
</html>
